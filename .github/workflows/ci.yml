name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.12"
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.28.3
          args: --enable-all -D=lll,gochecknoglobals,gosec,goconst,gocritic

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.10", "1.11", "1.12"]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}
      
      - name: Get dependencies
        run: make deps
      
      - name: Run tests
        run: make test

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.12"
      
      - name: Get dependencies
        run: make deps-integration
      
      - name: Run integration tests
        run: go test -v -race -tags integration -onfidoToken=${{ secrets.ONFIDO_TOKEN }}
